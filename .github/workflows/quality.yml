name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ganttist_testing
          MYSQL_USER: ganttist
          MYSQL_PASSWORD: ganttist
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ganttist_testing
      DB_USERNAME: ganttist
      DB_PASSWORD: ganttist
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TODOIST_DRIVER: fake
      GANTTIST_DEMO_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, fileinfo, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit PHP dependencies
        run: composer audit --no-interaction
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Run backend suite on MySQL
        run: php artisan test
      - name: Run frontend suite and type checks
        run: |
          npm test
          npx vue-tsc --noEmit
      - name: Build production assets
        run: npm run build
