name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ganttist_testing
          MYSQL_USER: ganttist
          MYSQL_PASSWORD: ganttist
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ganttist_testing
      DB_USERNAME: ganttist
      DB_PASSWORD: ganttist
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TODOIST_DRIVER: fake
      GANTTIST_DEMO_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, fileinfo, pdo_mysql, pdo_sqlite
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm ci
      - name: Install document processor dependencies
        run: python -m pip install -r scripts/documents/requirements.txt pytest==9.1.1
      - name: Audit PHP dependencies
        run: composer audit --no-interaction
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Run backend suite on MySQL
        shell: bash
        run: |
          set +e
          php artisan test 2>&1 | tee mysql-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostics=$(grep -E 'SQLSTATE|FAILED|Tests:|Error|Exception|Unknown column|Duplicate|Syntax' mysql-test.log | tail -n 20)
            if [ -z "$diagnostics" ]; then diagnostics=$(tail -n 20 mysql-test.log); fi
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done <<< "$diagnostics"
          fi
          exit "$status"
      - name: Run backend suite on SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
      - name: Run document processor suite
        run: python -m pytest scripts/documents/tests
      - name: Smoke document runtime and private storage
        run: |
          php artisan migrate --force
          php artisan documents:readiness --write
      - name: Run frontend suite and type checks
        shell: bash
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: |
          set +e
          npm test 2>&1 | tee frontend-test.log
          test_status=${PIPESTATUS[0]}
          npx vue-tsc --noEmit 2>&1 | tee frontend-typecheck.log
          type_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ] || [ "$type_status" -ne 0 ]; then
            diagnostics=$(grep -E 'FAIL|Error|error TS|Test Files|Tests ' frontend-test.log frontend-typecheck.log | tail -n 30)
            if [ -z "$diagnostics" ]; then diagnostics=$(tail -n 15 frontend-test.log; tail -n 15 frontend-typecheck.log); fi
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done <<< "$diagnostics"
          fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          exit "$type_status"
      - name: Build production assets
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run PWA scenarios
        shell: bash
        run: |
          set +e
          npm run test:e2e -- --reporter=line 2>&1 | tee pwa-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostics=$(grep -E 'failed \(|Error:|Timeout|Locator:|Expected:|Received:|Call log:|waiting for|at .*offline\.spec' pwa-test.log | tail -n 40)
            if [ -z "$diagnostics" ]; then diagnostics=$(tail -n 30 pwa-test.log); fi
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done <<< "$diagnostics"
          fi
          exit "$status"
