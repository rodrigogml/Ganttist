openapi: 3.1.0
info: { title: Ganttist Internal API, version: 0.2.0 }
servers: [{ url: /api/v1 }]
paths:
  /health:
    get:
      operationId: health
      responses: { '200': { description: Aplicação disponível } }
  /workspace:
    get:
      operationId: workspace
      responses:
        '200':
          description: Snapshot calculado do Gantt
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  /schedule/simulate:
    post:
      operationId: simulateSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [today, tasks]
              properties:
                today: { type: string, format: date }
                tasks: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/TaskInput' } }
                dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
      responses:
        '200': { description: Cenário não persistido }
        '422': { $ref: '#/components/responses/ValidationError' }
  /webhooks/todoist:
    post:
      operationId: todoistWebhook
      parameters:
        - { in: header, name: X-Todoist-Hmac-SHA256, required: true, schema: { type: string } }
      responses:
        '202': { description: Evento autenticado, deduplicado e aceito }
        '401': { description: Assinatura inválida }
  /projects/{projectId}/documents:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listProjectDocuments
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string, enum: [manual, derived] } }
        - { in: query, name: mimeFamily, schema: { type: string, enum: [application, image, text] } }
        - { in: query, name: state, schema: { type: string, enum: [ready, queued, processing, failed, outdated] } }
        - { in: query, name: 'tagIds[]', schema: { type: array, items: { type: string } } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      responses: { '200': { description: Página de 30 documentos } }
    post:
      operationId: uploadProjectDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, revisionLabel, file]
              properties:
                name: { type: string, maxLength: 255 }
                revisionLabel: { type: string, maxLength: 100 }
                file: { type: string, format: binary }
                tagIds: { type: array, items: { type: string } }
      responses: { '201': { description: Documento e primeira revisão criados }, '409': { description: Binário duplicado no documento } }
  /projects/{projectId}/documents/{documentId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DocumentId' }]
    get: { operationId: getProjectDocument, responses: { '200': { description: Documento } } }
    patch:
      operationId: updateProjectDocument
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, tagIds: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: Documento atualizado } }
    delete: { operationId: archiveProjectDocument, responses: { '204': { description: Documento arquivado }, '409': { description: Origem possui derivações ativas } } }
  /projects/{projectId}/documents/{documentId}/restore:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DocumentId' }]
    post: { operationId: restoreProjectDocument, responses: { '200': { description: Documento restaurado }, '409': { description: Origem ainda arquivada } } }
  /projects/{projectId}/documents/{documentId}/revisions:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DocumentId' }]
    get: { operationId: listDocumentRevisions, responses: { '200': { description: Histórico imutável } } }
    post:
      operationId: uploadDocumentRevision
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [revisionLabel, file], properties: { revisionLabel: { type: string }, file: { type: string, format: binary } } } } }
      responses: { '201': { description: Nova revisão promovida }, '409': { description: Binário duplicado ou documento arquivado } }
  /projects/{projectId}/revisions/{revisionId}/content:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { in: path, name: revisionId, required: true, schema: { type: string } }, { in: header, name: Range, schema: { type: string, example: bytes=0-1023 } }]
    get: { operationId: downloadDocumentRevision, responses: { '200': { description: Conteúdo completo }, '206': { description: Intervalo único de bytes }, '416': { description: Intervalo inválido } } }
    head: { operationId: inspectDocumentRevision, responses: { '200': { description: Metadados do conteúdo } } }
  /projects/{projectId}/tags:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get: { operationId: listProjectTags, responses: { '200': { description: Tags hierárquicas ativas } } }
    post:
      operationId: createProjectTag
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectTag' } } } }
      responses: { '201': { description: Tag criada }, '409': { description: Nome duplicado no mesmo nível } }
  /projects/{projectId}/tags/{tagId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { in: path, name: tagId, required: true, schema: { type: string } }]
    patch: { operationId: updateProjectTag, responses: { '200': { description: Tag atualizada }, '422': { description: Ciclo ou pai inválido } } }
    delete: { operationId: archiveProjectTag, responses: { '204': { description: Tag arquivada }, '409': { description: Possui tags-filhas ativas } } }
  /projects/{projectId}/documents/{documentId}/derivations:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DocumentId' }]
    get: { operationId: listDocumentDerivations, responses: { '200': { description: Derivações relacionadas } } }
    post:
      operationId: createDocumentDerivations
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DerivationBatch' } } } }
      responses: { '202': { description: Runs independentes enfileirados }, '422': { $ref: '#/components/responses/ValidationError' } }
  /projects/{projectId}/derivations/{derivationId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { in: path, name: derivationId, required: true, schema: { type: string } }]
    get: { operationId: getDocumentDerivation, responses: { '200': { description: Definição e último run } } }
    patch: { operationId: updateDocumentDerivation, responses: { '200': { description: Definição versionada } } }
    delete: { operationId: deactivateDocumentDerivation, responses: { '204': { description: Derivação desativada } } }
  /projects/{projectId}/derivations/{derivationId}/regenerate:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { in: path, name: derivationId, required: true, schema: { type: string } }]
    post: { operationId: regenerateDocumentDerivation, responses: { '202': { description: Run idempotente enfileirado } } }
  /projects/{projectId}/derivation-runs/{runId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { in: path, name: runId, required: true, schema: { type: string } }]
    get: { operationId: getDocumentDerivationRun, responses: { '200': { description: Estado e erro sanitizado do run } } }
  /projects/{projectId}/offline-manifest:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get: { operationId: getProjectOfflineManifest, responses: { '200': { description: Snapshot deliberado das revisões atuais } } }
components:
  parameters:
    ProjectId: { in: path, name: projectId, required: true, schema: { type: string } }
    DocumentId: { in: path, name: documentId, required: true, schema: { type: string } }
  schemas:
    Envelope:
      type: object
      required: [data]
      properties: { data: { type: object }, meta: { type: object } }
    TaskInput:
      type: object
      required: [id, title, duration]
      properties:
        id: { type: string }
        title: { type: string }
        start: { type: [string, 'null'], format: date }
        duration: { type: integer, minimum: 1, maximum: 3650 }
        completed: { type: boolean, default: false }
    Dependency:
      type: object
      required: [from, to, type]
      properties:
        from: { type: string }
        to: { type: string }
        type: { type: string, enum: [FS, SS, FF, SF] }
    ProjectTag:
      type: object
      required: [name]
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, maxLength: 255 }
        parentTagId: { type: [string, 'null'] }
    CropRect:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, exclusiveMinimum: 0, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
    DerivationBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [name, page, rectNormalized]
            properties:
              name: { type: string, maxLength: 255 }
              page: { type: integer, minimum: 1 }
              rectNormalized: { $ref: '#/components/schemas/CropRect' }
              tagIds: { type: array, items: { type: string } }
              autoRegenerate: { type: boolean, default: true }
  responses:
    ValidationError:
      description: Entrada inválida
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties: { message: { type: string }, errors: { type: object } }
